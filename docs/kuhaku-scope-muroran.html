<title>クウハクスコープ 室蘭</title>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{
  /* 地図タイルが無いので、市域(--land)と地(--ground)の明度差だけが海岸線を示す */
  --ground:#CFD9E1; --land:#FBF7F0; --panel:#FFFFFF; --line:#D5DCE2;
  --ink:#1B2430; --muted:#5C6B7A; --faint:#8A97A4;
  --accent:#1F5F8B; --accent-ink:#FFFFFF;
  --stop:#7C8A99; --static:#AEB8C2;
  --sev1:#F7D2B8; --sev2:#F0A575; --sev3:#E07440; --sev4:#BC4C22; --sev5:#7F2E14;
  --bar:#B8C4CE; --bar-on:#1F5F8B;
  --shadow:0 1px 2px rgba(27,36,48,.08), 0 6px 20px rgba(27,36,48,.08);
  --radius:6px;
  --font-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
  --font-num:"IBM Plex Sans","Zen Kaku Gothic New",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#080C11; --land:#212C36; --panel:#161D24; --line:#2A343E;
    --ink:#E7ECF1; --muted:#9AA7B4; --faint:#6E7C8A;
    --accent:#6FB1E0; --accent-ink:#0F151B;
    --stop:#55636F; --static:#3E4A56;
    --sev1:#6A3A2B; --sev2:#9A4E2E; --sev3:#C9662F; --sev4:#EE8A50; --sev5:#FFBE9A;
    --bar:#33404B; --bar-on:#6FB1E0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#080C11; --land:#212C36; --panel:#161D24; --line:#2A343E;
  --ink:#E7ECF1; --muted:#9AA7B4; --faint:#6E7C8A;
  --accent:#6FB1E0; --accent-ink:#0F151B;
  --stop:#55636F; --static:#3E4A56;
  --sev1:#6A3A2B; --sev2:#9A4E2E; --sev3:#C9662F; --sev4:#EE8A50; --sev5:#FFBE9A;
  --bar:#33404B; --bar-on:#6FB1E0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-jp);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.app{display:grid;grid-template-columns:344px 1fr;height:100%}
.panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding-block:20px;padding-inline:20px;display:flex;flex-direction:column;gap:18px}
.map-wrap{position:relative;min-height:0}
#map{position:absolute;inset:0}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:12.5px;margin:4px 0 0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:500}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{flex:1;background:transparent;border:0;color:var(--muted);font:inherit;font-weight:500;padding:7px 0;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hour{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:28px;font-weight:600;line-height:1}
.hour small{font-size:13px;font-weight:400;color:var(--muted);font-family:var(--font-jp);margin-left:4px}
input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 0}
.ticks{display:flex;justify-content:space-between;font-family:var(--font-num);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tile.lead{grid-column:1/-1;border-color:transparent;background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.tile .k{font-size:11.5px;color:var(--muted)}
.tile .v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;line-height:1.15}
.tile.lead .v{font-size:30px}
.tile .v small{font-size:12px;font-weight:400;color:var(--muted);margin-left:3px}
.tile .d{font-size:11.5px;color:var(--muted);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.chart{display:flex;flex-direction:column;gap:6px}
.chart svg{width:100%;height:auto;display:block}
.chart .cap{font-size:11.5px;color:var(--muted)}
.note{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.note b{color:var(--ink);font-weight:500}
details{font-size:12px}
summary{cursor:pointer;color:var(--accent);font-weight:500}
table{border-collapse:collapse;width:100%;margin-top:8px;font-family:var(--font-num);font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:3px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;font-family:var(--font-jp)}
th{color:var(--muted);font-weight:500;font-size:11px}
.legend{position:absolute;left:16px;bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;max-width:260px}
.legend .t{font-size:11.5px;color:var(--muted)}
.ramp{display:flex;gap:2px}
.ramp i{flex:1;height:10px;border-radius:2px;display:block}
.ramp-l{display:flex;justify-content:space-between;font-family:var(--font-num);font-size:10.5px;color:var(--faint)}
.keys{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block;border:1px solid var(--line)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--stop);margin:0 3px}
.hint{position:absolute;right:16px;top:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:6px 10px;font-size:11.5px;color:var(--muted);box-shadow:var(--shadow)}
.inset{position:absolute;left:16px;top:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:9px 10px 7px;box-shadow:var(--shadow);width:168px}
.inset svg{width:100%;height:auto;display:block}
.inset .t{font-size:10.5px;color:var(--faint);margin-top:5px;line-height:1.45}
.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;font-size:12.5px;color:var(--muted);box-shadow:var(--shadow);max-width:80%;white-space:pre-wrap}
.status.err{color:#B3261E;border-color:#B3261E}
.dk-tip{font-family:var(--font-jp);font-size:12px;line-height:1.45}
.dk-tip b{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:58vh auto;height:auto;min-height:100%}
  .map-wrap{order:-1;height:58vh}
  .panel{border-right:0;border-top:1px solid var(--line)}
  .legend{max-width:200px}
  /* 狭い画面ではインセットと重なるので注記は省く */
  .hint{display:none}
  .inset{width:118px;padding:7px 8px 5px}
  .inset .t{font-size:9.5px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="app">
  <aside class="panel">
    <div>
      <h1>クウハクスコープ 室蘭</h1>
      <p class="sub" id="sub"></p>
    </div>

    <div>
      <div class="eyebrow">ダイヤ</div>
      <div class="seg" role="group" aria-label="ダイヤ" style="margin-top:6px">
        <button type="button" id="day-wd" aria-pressed="true">平日</button>
        <button type="button" id="day-hd" aria-pressed="false">土日祝</button>
      </div>
    </div>

    <div>
      <div class="row">
        <div class="eyebrow">拠点への到着時刻</div>
        <div class="hour"><span id="hour-v">9</span><small>時までに着く</small></div>
      </div>
      <input type="range" id="hour" min="5" max="22" step="1" value="9" aria-label="到着時刻（時）">
      <div class="ticks"><span>5</span><span>8</span><span>11</span><span>14</span><span>17</span><span>20</span><span>22</span></div>
    </div>

    <div class="tiles" id="tiles"></div>

    <div class="chart">
      <div class="eyebrow">時間帯別の空白人口</div>
      <svg id="bars" viewBox="0 0 304 120" role="img" aria-label="時間帯別の空白人口"></svg>
      <div class="cap" id="bars-cap"></div>
    </div>

    <div class="note" id="note"></div>

    <details>
      <summary>数値の一覧（表）</summary>
      <div id="table"></div>
    </details>
  </aside>

  <main class="map-wrap">
    <div id="map" aria-label="3Dマップ"></div>
    <div id="status" class="status">3D ライブラリを読み込んでいます…</div>
    <figure class="inset">
      <svg id="inset-svg" viewBox="0 0 168 130" role="img" aria-label="北海道における室蘭市の位置"></svg>
      <figcaption class="t">北海道における室蘭市の位置<br>輪郭: 地球地図日本（国土地理院）</figcaption>
    </figure>
    <div class="legend">
      <div class="t">柱の高さ ＝ その時刻までに拠点へ着けない人口</div>
      <div class="ramp" id="ramp"></div>
      <div class="ramp-l"><span>1–3</span><span>4–7</span><span>8–11</span><span>12–15</span><span>16–18 時間帯</span></div>
      <div class="t">暖色 ＝ 時間空白。濃いほど1日18時間帯のうち多くの時間帯で着けない</div>
      <div class="keys">
        <span><i class="sw" style="background:var(--static)"></i>灰色の土台 ＝ 静的空白（徒歩圏にバス停がない）</span>
        <span><i class="sw" style="background:var(--land)"></i>室蘭市の市域（100mメッシュ人口の範囲）</span>
        <span><i class="dot"></i>バス停</span>
      </div>
    </div>
    <div class="hint">北海道 室蘭市（絵鞆半島）／ 地図タイルは使わず、市域は人口メッシュの範囲で描いています</div>
  </main>
</div>

  var el = document.getElementById("status");

  el.hidden = false; el.textContent = msg; el.classList.toggle("err", !!err);
};
window.addEventListener("error", function(e){

  window.__status("エラー: " + m, true);
}, true);
</script>

const M = D.meta;
const DAYS = {wd:"平日", hd:"日祝"};
let dayKey = "wd", hour = 9;

const $ = s => document.querySelector(s);
const fmt = n => Number(n).toLocaleString("ja-JP");
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rgb = (hex, a=255) => { const h=hex.replace("#",""); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),a]; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

$("#sub").textContent = `${M.dest}へ${M.max_time_min}分以内に着けるか ／ 徒歩${M.walk_m}m・${M.walk_speed}m/分 ／ ${M.mesh_m}mメッシュ`;

const cells = D.cells.map(c => ({
  ...c,
  polygon: [[c.lon-M.half_lon,c.lat-M.half_lat],[c.lon+M.half_lon,c.lat-M.half_lat],
            [c.lon+M.half_lon,c.lat+M.half_lat],[c.lon-M.half_lon,c.lat+M.half_lat]]
}));
// 市域（100mメッシュ人口データの範囲＝室蘭市）。地図タイルが無いので、
// これが海岸線と絵鞆半島の形を示す唯一の手がかりになる。
const LH = M.land_half_lat, LW = M.land_half_lon;
const land = (D.land || []).map(([lon,lat]) => ({
  polygon: [[lon-LW,lat-LH],[lon+LW,lat-LH],[lon+LW,lat+LH],[lon-LW,lat+LH]]
}));
const charset = Array.from(new Set(D.labels.map(l=>l.name).join("").split("")));

function sevStep(h){ return h<=3?1:h<=7?2:h<=11?3:h<=15?4:5; }
function sevColor(h){ return rgb(tok(`--sev${sevStep(h)}`)); }

function layers(){
  const day = DAYS[dayKey];
  const vals = D.values[day][hour], eld = D.elderly[day][hour], sev = D.severity[day];
  const data = cells.map((c,i)=>({...c, blank:vals[i], eld:eld[i], sev:sev[i]}));
  const theme = tok("--ink");
  return [
    new deck.PolygonLayer({id:"land", data:land, getPolygon:d=>d.polygon, stroked:false, filled:true,
      getFillColor: rgb(tok("--land")), updateTriggers:{getFillColor:[theme]}}),
    new deck.ScatterplotLayer({id:"stops", data:D.stops, getPosition:d=>d, getRadius:22, radiusMinPixels:1.2,
      radiusMaxPixels:3, getFillColor: rgb(tok("--stop"),170), updateTriggers:{getFillColor:[theme]}}),
    // 静的空白（徒歩圏にバス停なし）はダイヤに関係なく終日空白になるので、
    // 灰色の土台として描き、その上に時間空白の柱（暖色・深刻度で色分け）を立てる。
    // 内側の柱は総空白人口の高さで、土台に隠れない部分がちょうど時間空白の分になる。
    new deck.ColumnLayer({id:"static", data, diskResolution:4, angle:45, radius:300, extruded:true, elevationScale:5,
      getPosition:d=>[d.lon,d.lat], getElevation:d=>d.static_pop,
      getFillColor:d=> d.static_pop>0 ? rgb(tok("--static")) : [0,0,0,0],
      getLineColor:[0,0,0,0], pickable:true, autoHighlight:true, highlightColor:rgb(tok("--accent"),160),
      updateTriggers:{getFillColor:[theme]}}),
    new deck.ColumnLayer({id:"time", data, diskResolution:4, angle:45, radius:255, extruded:true, elevationScale:5,
      getPosition:d=>[d.lon,d.lat], getElevation:d=>d.blank,
      getFillColor:d=> (d.blank - d.static_pop)>0 ? sevColor(d.sev) : [0,0,0,0],
      getLineColor:[0,0,0,0], pickable:true, autoHighlight:true, highlightColor:rgb(tok("--accent"),200),
      transitions: reduced ? {} : {getElevation:{duration:350}},
      updateTriggers:{getElevation:[dayKey,hour], getFillColor:[dayKey,hour,theme]}}),
    new deck.TextLayer({id:"labels", data:D.labels, getPosition:d=>[d.lon,d.lat], getText:d=>d.name, getSize:12.5,
      getColor: rgb(tok("--ink")), fontFamily:'"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI",sans-serif', fontWeight:500,
      characterSet:charset, background:true, getBackgroundColor: rgb(tok("--panel"),225), backgroundPadding:[6,3],
      getPixelOffset:[0,-12], parameters:{depthTest:false},
      updateTriggers:{getColor:[theme], getBackgroundColor:[theme]}})
  ];
}

let dk = null;
function initDeck(){
  if(typeof deck === "undefined"){
    window.__status("3D ライブラリ(deck.gl)が読み込まれていません。数値パネルは利用できます。", true);
    return;
  }
  try{
    dk = new deck.DeckGL({
      container:"map",
      initialViewState:{longitude:M.center.lon, latitude:M.center.lat - 0.004, zoom:11.6, pitch:52, bearing:-12},
      controller:true,
      layers: layers(),
      getTooltip: ({object}) => object && object.blank>0 && {
        html:`<div class="dk-tip">${DAYS[dayKey]}・${hour}時着（メッシュ人口 ${fmt(object.pop)}）<br>`
            +`空白人口 <b>${fmt(object.blank)}</b>人 ＝ 時間空白 <b>${fmt(object.blank-object.static_pop)}</b> ＋ 静的空白 <b>${fmt(object.static_pop)}</b><br>`
            +`うち高齢者 <b>${fmt(object.eld)}</b>人<br>`
            +(object.blank-object.static_pop>0 ? `時間空白になる時間帯 <b>${object.sev}</b>/18` : `徒歩圏にバス停がない（ダイヤによらず空白）`)
            +`</div>`,
        style:{background:tok("--panel"), color:tok("--ink"), border:`1px solid ${tok("--line")}`, borderRadius:"6px", padding:"8px 10px", boxShadow:tok("--shadow"), fontSize:"12px"}
      }
    });
    window.__status(null);
  }catch(e){
    window.__status("3D 描画の初期化に失敗しました: " + (e && e.message ? e.message : e), true);
  }
}

function render(){
  const day = DAYS[dayKey], other = DAYS[dayKey==="wd"?"hd":"wd"];
  const s = D.summary[day][hour], o = D.summary[other][hour];
  const timeBlank = s.blank_pop - s.static_blank_pop;
  const pct = v => (100*v/s.total_pop).toFixed(1);
  const diff = s.blank_pop - o.blank_pop;
  $("#hour-v").textContent = hour;
  $("#tiles").innerHTML = `
    <div class="tile lead"><div class="k">空白人口（${day}・${hour}時着まで）</div>
      <div class="v">${fmt(s.blank_pop)}<small>人 ／ 市の ${pct(s.blank_pop)}%</small></div>
      <div class="d">${other}の同時刻 ${fmt(o.blank_pop)}人（${diff>=0?"+":""}${fmt(diff)}）</div></div>
    <div class="tile"><div class="k">うち高齢者（65歳以上）</div><div class="v">${fmt(s.blank_elderly)}<small>人</small></div></div>
    <div class="tile"><div class="k">総人口</div><div class="v">${fmt(s.total_pop)}<small>人</small></div></div>
    <div class="tile"><div class="k">静的空白 ― 徒歩圏にバス停がない</div><div class="v">${fmt(s.static_blank_pop)}<small>人</small></div><div class="d">ダイヤによらず一定</div></div>
    <div class="tile"><div class="k">時間空白 ― バス停はあるが間に合わない</div><div class="v">${fmt(timeBlank)}<small>人</small></div><div class="d">本作が測る対象</div></div>`;
  drawBars();
  $("#note").innerHTML = `<b>読み方</b>　同じ場所でも到着時刻を動かすと柱が伸び縮みします。赤が濃い柱ほど、1日のうち多くの時間帯で拠点に着けません。土曜と日祝は時刻表が同一のため「土日祝」にまとめています。数値は transit_engine の時刻依存ダイクストラ法による計算結果で、AIが生成した図形ではありません。`;
  if(dk) dk.setProps({layers: layers()});
}

function drawBars(){
  const W=304,H=120,L=34,R=6,T=10,B=22;
  const ymax = D.summary["平日"][5].total_pop;
  const hours = M.hours, n = hours.length;
  const bw = (W-L-R)/n, gap = 2;
  const y = v => T + (H-T-B)*(1 - v/ymax);
  const day = DAYS[dayKey];
  const bar = tok("--bar"), on = tok("--bar-on"), faint = tok("--faint"), line = tok("--line"), muted=tok("--muted"), ink=tok("--ink");
  let g = "";
  [0,0.25,0.5,0.75,1].forEach(f=>{
    const v=Math.round(ymax*f), yy=y(v);
    g += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="${line}" stroke-width="${f===1?1:0.6}" ${f===1?'stroke-dasharray="3 3"':''}/>`;
    g += `<text x="${L-4}" y="${yy+3.5}" text-anchor="end" font-size="9" fill="${faint}" font-family="IBM Plex Sans,system-ui">${f===0?"0":f===1?"総人口":(v/1000|0)+"k"}</text>`;
  });
  hours.forEach((h,i)=>{
    const v = D.summary[day][h].blank_pop, x = L + i*bw + gap/2, yy = y(v), hh = H-B-yy;
    const sel = h===hour;
    g += `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${(bw-gap).toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="${sel?on:bar}" data-h="${h}" style="cursor:pointer"><title>${h}時着 ${fmt(v)}人</title></rect>`;
    if(sel) g += `<text x="${(x+(bw-gap)/2).toFixed(1)}" y="${(yy-4).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="600" fill="${ink}" font-family="IBM Plex Sans,system-ui">${fmt(v)}</text>`;
    if(h%3===2||h===5) g += `<text x="${(x+(bw-gap)/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" fill="${muted}" font-family="IBM Plex Sans,system-ui">${h}</text>`;
  });
  $("#bars").innerHTML = g;
  const worst = hours.reduce((a,h)=>D.summary[day][h].blank_pop>D.summary[day][a].blank_pop?h:a, hours[0]);
  const best  = hours.reduce((a,h)=>D.summary[day][h].blank_pop<D.summary[day][a].blank_pop?h:a, hours[0]);
  $("#bars-cap").textContent = `${day}: 最小 ${best}時着 ${fmt(D.summary[day][best].blank_pop)}人 ／ 最大 ${worst}時着 ${fmt(D.summary[day][worst].blank_pop)}人。棒をクリックで時刻を変更`;
}
$("#bars").addEventListener("click", e=>{ const h=e.target.getAttribute("data-h"); if(h){ hour=+h; $("#hour").value=h; render(); }});

function buildTable(){
  let t = `<table><thead><tr><th>到着時刻</th><th>平日 空白人口</th><th>平日 高齢者</th><th>土日祝 空白人口</th><th>土日祝 高齢者</th></tr></thead><tbody>`;
  M.hours.forEach(h=>{ const a=D.summary["平日"][h], b=D.summary["日祝"][h];
    t += `<tr><td>${h}時</td><td>${fmt(a.blank_pop)}</td><td>${fmt(a.blank_elderly)}</td><td>${fmt(b.blank_pop)}</td><td>${fmt(b.blank_elderly)}</td></tr>`; });
  t += `</tbody></table>`;
  $("#table").innerHTML = t;
}
function buildRamp(){ $("#ramp").innerHTML = [1,2,3,4,5].map(i=>`<i style="background:var(--sev${i})"></i>`).join(""); }

// 隅の北海道インセット。市域の形だけでは道内のどこかが分からないため、
// 全体の中での室蘭の位置を示す。緯度による経度の縮みを補正して描く。
function buildInset(){
  const rings = D.hokkaido || [];
  if(!rings.length) return;
  const W = 168, H = 130, PAD = 9;
  const pts = rings.flat();
  const lo0 = Math.min(...pts.map(p=>p[0])), lo1 = Math.max(...pts.map(p=>p[0]));
  const la0 = Math.min(...pts.map(p=>p[1])), la1 = Math.max(...pts.map(p=>p[1]));
  const kx = Math.cos((la0+la1)/2 * Math.PI/180);      // 経度1度は緯度1度より短い
  const s = Math.min((W-PAD*2)/((lo1-lo0)*kx), (H-PAD*2)/(la1-la0));
  const ox = (W - (lo1-lo0)*kx*s)/2, oy = (H - (la1-la0)*s)/2;
  const X = lon => ox + (lon-lo0)*kx*s;
  const Y = lat => oy + (la1-lat)*s;                    // 北が上
  const paths = rings.map(r =>
    `<path d="${r.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("")}Z" `
    + `fill="${tok("--land")}" stroke="${tok("--faint")}" stroke-width=".7" stroke-linejoin="round"/>`
  ).join("");
  const mx = X(M.center.lon), my = Y(M.center.lat);
  $("#inset-svg").innerHTML = paths
    + `<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="7" fill="none" stroke="${tok("--sev4")}" stroke-width="1.6"/>`
    + `<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="2.6" fill="${tok("--sev5")}"/>`
    + `<text x="${(mx-10).toFixed(1)}" y="${(my+4).toFixed(1)}" text-anchor="end" font-size="10" font-weight="700" `
    + `fill="${tok("--ink")}" font-family="Zen Kaku Gothic New, sans-serif">室蘭</text>`;
}

$("#hour").addEventListener("input", e=>{ hour=+e.target.value; render(); });
$("#day-wd").addEventListener("click", ()=>setDay("wd"));
$("#day-hd").addEventListener("click", ()=>setDay("hd"));
function setDay(k){ dayKey=k; $("#day-wd").setAttribute("aria-pressed", k==="wd"); $("#day-hd").setAttribute("aria-pressed", k==="hd"); render(); }

// テーマが切り替わったら deck.gl 側の色も引き直す
function repaint(){ buildInset(); render(); }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", repaint);
new MutationObserver(repaint).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

buildRamp(); buildTable(); buildInset(); initDeck(); render();
</script>
